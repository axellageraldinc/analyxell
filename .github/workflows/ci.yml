name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret and personal-data scan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan working tree and history
        shell: pwsh
        run: ./scripts/check-secrets.ps1 -History

  build-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Unit tests
        run: dotnet test tests/Analyxell.Core.Tests --nologo --configuration Release
      - name: Build the WinUI app
        run: dotnet build src/Analyxell/Analyxell.csproj --configuration Release -p:Platform=x64 --nologo
